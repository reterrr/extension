name: Temporary branch check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Typecheck baseline report
        continue-on-error: true
        run: npm run typecheck
      - name: New document-requirement contracts
        run: >-
          node --test
          --test-name-pattern="repository portable-import example stays importable|dynamic documents support operator templates|operator-template documents reject missing physical template|RoundImport exports configured documents|classified physical files migrate to first-class document requirements once|Documents section separates physical files from document requirements"
          tests/file-source-contracts.test.mjs
          tests/import-review-contracts.test.mjs
          tests/workflow-ui-contracts.test.mjs
      - run: npm run build
