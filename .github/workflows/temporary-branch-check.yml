name: Temporary branch check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Typecheck baseline report
        continue-on-error: true
        run: npm run typecheck
      - name: Relevant contract tests
        run: node --test tests/core.test.cjs tests/file-source-contracts.test.mjs tests/import-review-contracts.test.mjs tests/portable-roundtrip-contracts.test.mjs tests/bur-excel-export-contracts.test.mjs tests/workflow-ui-contracts.test.mjs tests/change-review-contracts.test.mjs tests/commit-staging-contracts.test.mjs
      - run: npm run build
